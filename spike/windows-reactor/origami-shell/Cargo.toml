[package]
name = "origami-shell"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Pinned to the commit just before windows-rs #5362: the next main commits abort at startup
# with "Typename has an invalid format" (windows-rs issue 5386, filed 2026-11-15).
# REACTOR_REV in the workflow overrides this to test main's head.
[dependencies]
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c0297e588ce9754ad44f80787c918a45092d735a" }
windows-pickers = { git = "https://github.com/microsoft/windows-rs", rev = "c0297e588ce9754ad44f80787c918a45092d735a", default-features = false, features = ["reactor"] }
wc = { package = "windows-core", git = "https://github.com/microsoft/windows-rs", rev = "c0297e588ce9754ad44f80787c918a45092d735a" }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "c0297e588ce9754ad44f80787c918a45092d735a" }

[profile.release-small]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
