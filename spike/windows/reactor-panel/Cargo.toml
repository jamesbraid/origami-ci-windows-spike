[package]
name = "reactor-panel"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
windows-reactor = "0.100.0"
wc100 = { package = "windows-core", version = "0.100.0" }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
]
